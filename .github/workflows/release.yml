name: Release jac-loadtest to PyPI

on:
  push:
    branches:
      - main

env:
  # Keep in sync with test.yml so a release is always built with the same
  # jac version that passed CI.
  JAC_VERSION: "0.39.2"

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: version
        run: |
          CURRENT=$(grep '^version = ' jac_loadtest_cli/jac.toml | sed 's/version = "\(.*\)"/\1/')
          PREVIOUS=$(git show HEAD~1:jac_loadtest_cli/jac.toml 2>/dev/null | grep '^version = ' | sed 's/version = "\(.*\)"/\1/' || echo "none")
          echo "current=$CURRENT"
          echo "previous=$PREVIOUS"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$CURRENT" >> $GITHUB_OUTPUT

      - name: Set up Python 3.12
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jac
        if: steps.version.outputs.changed == 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh | bash -s -- --version "$JAC_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install jac tooling
        if: steps.version.outputs.changed == 'true'
        run: pip install twine

      # `jac build` type-checks the project, and the checker resolves HarUser's base
      # class (Locust's FastHttpUser) from the installed packages. Without this step
      # every inherited attribute (client, environment, stop) is reported missing.
      - name: Install project dependencies
        if: steps.version.outputs.changed == 'true'
        working-directory: jac_loadtest_cli
        run: jac install

      - name: Build package
        if: steps.version.outputs.changed == 'true'
        working-directory: jac_loadtest_cli
        # `jac build` type-checks the whole project first and, since jac 0.39,
        # offers no way to skip that gate (--no_typecheck was removed). The
        # project passes it; keep it that way rather than reaching for a bypass.
        run: jac build --as wheel

      - name: Publish to PyPI
        if: steps.version.outputs.changed == 'true'
        working-directory: jac_loadtest_cli
        run: twine upload dist/* -u __token__ -p ${{ secrets.PYPI_TOKEN }}

      # Tagging comes last, after the artifact is built AND published. Everything
      # above this point is retryable: a failed build or a rejected upload leaves
      # no tag and no release behind, so the fix is to push a corrected commit and
      # let the workflow run again -- no manual `git push --delete` first. The
      # previous order tagged before building, so any build failure stranded a tag
      # and a GitHub release pointing at a version that was never published.
      - name: Tag release
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
