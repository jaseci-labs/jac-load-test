[project]
name = "jac-loadtest"
version = "0.11.0"
description = "HAR-based load testing library for jac-scale applications"
authors = [{ name = "Sahan Udayanga", email = "sahanudayangaof@gmail.com" }, { name = "Ravimal Ranathunga", email = "ravimalranathunga@gmail.com" }]
maintainers = [{ name = "Sahan Udayanga", email = "sahanudayangaof@gmail.com" }, { name = "Ravimal Ranathunga", email = "ravimalranathunga@gmail.com" }]
license = "MIT"
readme = "README.md"
keywords = ["load-testing", "har", "jac", "jaclang", "jaseci", "jac-scale", "performance"]
requires-python = ">=3.12"
# A distributable library/CLI built into a wheel (`jac build --as wheel`). Without
# a kind, a bare `jac check` looks for a main.jac entry point that does not exist.
kind = "py-package"
entry-point = "jac_loadtest_cli.plugin"
# Pin the jac toolchain. The language is still moving: keywords stopped being
# valid identifiers, bare `list`/`dict` annotations became errors and type
# checking runs on every compile, so an older or newer toolchain can reject
# this source outright. Keep this in step with JAC_VERSION in
# .github/workflows/{test,release}.yml so CI and local development compile the
# same source.
jac-version = "0.39.2"

# This project is Python-ecosystem code (Locust, aiohttp, argparse), so native
# lowering never applies. Opting out stops the compiler attempting it for every
# module, which is slow and, for some modules, exhausts memory on small machines.
[placement]
default = "server"

[project.urls]
repository = "https://github.com/jaseci-labs/jac-load-test"
source = "https://github.com/jaseci-labs/jac-load-test/main/jac-loadtest-cli"
issues = "https://github.com/jaseci-labs/jac-load-test/issues"

[project.include]
packages = ["jac_loadtest_cli"]

[entrypoints.scripts]
loadtest = "jac_loadtest_cli.plugin:main"

[dependencies.pypi]
# Load engine: Locust does load generation, scheduling, statistics and the console
# and HTML reports. Only imported from runner/, never at plugin load.
locust = ">=2.30.0"
# WebSocket / graphql-ws replay inside Locust users (blocking API, gevent-friendly).
websocket-client = ">=1.7.0"
# Test-only: the mock jac-scale server in the integration tests.
aiohttp = ">=3.11.0,<4.0.0"
